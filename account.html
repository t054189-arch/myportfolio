<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My account — Bloom</title>
<meta name="description" content="Your Bloom account, and the way through to your gahwa check-in log.">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<!-- Restore theme and reading direction before the first paint. -->
<script>
(function () {
  try {
    var theme = localStorage.getItem('bloom.theme');
    if (theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-theme', theme);
    if (localStorage.getItem('bloom.lang') === 'ar') {
      var html = document.documentElement;
      html.setAttribute('lang', 'ar');
      html.setAttribute('dir', 'rtl');
      html.classList.add('lang-ar');
    }
  } catch (e) { /* private mode — carry on in English and the OS theme */ }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body data-page="account" data-title-en="My account — Bloom" data-title-ar="حسابي — بلوم">
<main id="main">
  <section class="wrap">
    <div class="page-head">
      <p class="eyebrow" id="account-greet"></p>
      <h1 data-en="My account" data-ar="حسابي">My account</h1>
    </div>

    <!-- The gahwa log's own numbers, repeated here, linking through. -->
    <div id="account-gahwa"></div>

    <!-- Export and delete used to be here. They moved into gahwa/, next
         to the data they act on: a host site should not be the thing that
         offers to delete a log it cannot read. -->
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/scene.js"></script>
<script src="js/rings.js"></script>
<script src="js/db.js"></script>
<!-- The module, loaded for its public API only. Bloom calls
     gahwa.myCheckIns() and nothing else. -->
<script src="gahwa/gahwa.js"></script>
<script src="js/main.js"></script>
</body>
</html>

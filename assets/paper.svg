<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img">
  <!-- One stroke weight across every tool and machine, in the brass tone.
       An SVG loaded through an img tag cannot read prefers-color-scheme, so
       this value is chosen to hold on both the cream and the roasted ground. -->

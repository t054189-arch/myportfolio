<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brew guides — Bloom</title>
<meta name="description" content="Three recipes from the Bloom bar in Kuwait: V60 pour-over, French press and espresso, in grams, degrees and seconds.">
<!-- Restore theme and reading direction before the first paint. -->
<script>
(function () {
  try {
    var theme = localStorage.getItem('bloom.theme');
    if (theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-theme', theme);
    if (localStorage.getItem('bloom.lang') === 'ar') {
      var html = document.documentElement;
      html.setAttribute('lang', 'ar');
      html.setAttribute('dir', 'rtl');
      html.classList.add('lang-ar');
    }
  } catch (e) { /* private mode — carry on in English and the OS theme */ }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

     every page carries exactly the same one. -->

      <h1 data-en="Brew guides" data-ar="طرق التحضير">Brew guides</h1>
      <p class="lede" data-en="The three recipes we run on the bar. Weigh everything, start the timer at the first drop, and change one variable at a time." data-ar="الوصفات الثلاث التي نعمل بها على البار. زِن كل شيء، وابدأ المؤقّت مع أول قطرة، وغيّر عاملاً واحداً في كل مرة.">The three recipes we run on the bar.</p>
    </div>

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gahwa log — Bloom</title>
<meta name="description" content="A private diary of the coffee you drink: where you were, who you were with, and whether it was any good. Only you can read it.">
<!-- Nothing on this page should ever be indexed or previewed: it is one
     person's diary, and it needs an account to load at all. -->
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<!-- Restore theme and reading direction before the first paint. -->
<script>
(function () {
  try {
    var theme = localStorage.getItem('bloom.theme');
    if (theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-theme', theme);
    if (localStorage.getItem('bloom.lang') === 'ar') {
      var html = document.documentElement;
      html.setAttribute('lang', 'ar');
      html.setAttribute('dir', 'rtl');
      html.classList.add('lang-ar');
    }
  } catch (e) { /* private mode — carry on in English and the OS theme */ }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body data-page="gahwa-log" data-title-en="Gahwa log — Bloom" data-title-ar="سجل القهوة — بلوم">
<!-- The header, footer and cart drawer are injected by js/main.js so that
     every page carries exactly the same one. -->
<main id="main">
  <section class="wrap">
    <div class="page-head">
      <p class="eyebrow" data-en="Yours only" data-ar="لك وحدك">Yours only</p>
      <h1 data-en="Gahwa log" data-ar="سجل القهوة">Gahwa log</h1>
      <p class="lede" data-en="A private diary of the coffee you drink — where you were, who you were with, and whether it was any good." data-ar="دفتر خاص للقهوة التي تشربها — أين كنت، ومع من، وهل كانت جيدة.">A private diary of the coffee you drink — where you were, who you were with, and whether it was any good.</p>
      <p class="note gahwa-lock" data-en="Only you can read this. Not the shop, not anyone else." data-ar="أنت وحدك تقرأ هذا. لا المتجر ولا أي شخص آخر.">Only you can read this. Not the shop, not anyone else.</p>
    </div>

    <!-- Everything below is rendered by js/gahwa-page.js, because all of it
         comes from the signed-in customer's own rows. -->
    <div id="gahwa-root"></div>
  </section>
</main>

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Bloom</title>
<meta name="description" content="Sign in to Bloom, a specialty coffee shop in Kuwait, to see your saved brews and orders — or continue as a guest.">
<!-- Restore theme and reading direction before the first paint. -->
<script>
(function () {
  try {
    var theme = localStorage.getItem('bloom.theme');
    if (theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-theme', theme);
    if (localStorage.getItem('bloom.lang') === 'ar') {
      var html = document.documentElement;
      html.setAttribute('lang', 'ar');
      html.setAttribute('dir', 'rtl');
      html.classList.add('lang-ar');
    }
  } catch (e) { /* private mode — carry on in English and the OS theme */ }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body data-page="login" data-title-en="Sign in — Bloom" data-title-ar="تسجيل الدخول — بلوم">

<main id="main" class="login-page">

  <!-- The V60 rig, turning slowly. Falls back to a flat SVG with no WebGL. -->
  <div class="scene login-scene" id="login-scene"
       data-model="v60" data-mode="auto" data-fallback="assets/v60-rig.svg"></div>

  <div class="login-controls">
    <button type="button" class="icon-btn icon-btn-wide" id="lang-btn"
            data-en-label="Switch to Arabic" data-ar-label="التبديل إلى الإنجليزية"></button>
    <button type="button" class="icon-btn" id="theme-btn"
            data-en-label="Switch to dark theme" data-ar-label="التبديل إلى الوضع الداكن"></button>
  </div>

  <div class="login-card" id="login-card">
    <h1 class="login-mark">Bl<em>oo</em>m</h1>

    <!-- Two doors in one card. The tabs are real tabs so a keyboard and a
         screen reader both understand that one of two panels is showing. -->
    <div class="auth-tabs" role="tablist"
         data-en-label="Sign in or create an account" data-ar-label="تسجيل الدخول أو إنشاء حساب">
      <button type="button" class="auth-tab" id="tab-signin" role="tab"
              aria-selected="true" aria-controls="signin-form"
              data-en="Sign in" data-ar="تسجيل الدخول">Sign in</button>
      <button type="button" class="auth-tab" id="tab-signup" role="tab"
              aria-selected="false" aria-controls="signup-form" tabindex="-1"
              data-en="Create account" data-ar="إنشاء حساب">Create account</button>
    </div>

    <!-- ---------- Sign in: an existing customer only ---------- -->
    <form class="auth-panel" id="signin-form" role="tabpanel" aria-labelledby="tab-signin" novalidate>
      <p class="note" data-en="Welcome back — sign in to see your saved brews and orders."
         data-ar="أهلاً بعودتك — سجّل الدخول لعرض وصفاتك المحفوظة وطلباتك.">Welcome back — sign in to see your saved brews and orders.</p>

      <div class="field">
        <label for="signin-email" data-en="Email" data-ar="البريد الإلكتروني">Email</label>
        <input type="email" id="signin-email" name="email" autocomplete="email" inputmode="email"
               autocapitalize="none" spellcheck="false"
               data-en-placeholder="you@example.com" data-ar-placeholder="you@example.com">
      </div>

      <div class="field">
        <label for="signin-password" data-en="Password" data-ar="كلمة المرور">Password</label>
        <input type="password" id="signin-password" name="password" autocomplete="current-password"
               data-en-placeholder="••••••••" data-ar-placeholder="••••••••">
      </div>

      <p class="form-msg" id="signin-msg" hidden role="alert"></p>

      <button type="submit" class="btn btn-primary btn-block" id="signin-submit"
              data-en="Sign in" data-ar="تسجيل الدخول">Sign in</button>

      <p class="auth-swap">
        <span data-en="No account yet?" data-ar="ليس لديك حساب؟">No account yet?</span>
        <button type="button" class="linkish" data-goto="signup"
                data-en="Create one" data-ar="أنشئ حساباً">Create one</button>
      </p>
    </form>

    <!-- ---------- Sign up: this is what makes an account exist ---------- -->
    <form class="auth-panel" id="signup-form" role="tabpanel" aria-labelledby="tab-signup" novalidate hidden>
      <p class="note" data-en="Create an account to keep your orders and saved brews."
         data-ar="أنشئ حساباً لحفظ طلباتك ووصفاتك.">Create an account to keep your orders and saved brews.</p>

      <div class="field">
        <label for="signup-name" data-en="Name" data-ar="الاسم">Name</label>
        <input type="text" id="signup-name" name="name" autocomplete="name"
               data-en-placeholder="What should we call you?" data-ar-placeholder="بماذا نناديك؟">
      </div>

      <div class="field">
        <label for="signup-email" data-en="Email" data-ar="البريد الإلكتروني">Email</label>
        <input type="email" id="signup-email" name="email" autocomplete="email" inputmode="email"
               autocapitalize="none" spellcheck="false"
               data-en-placeholder="you@example.com" data-ar-placeholder="you@example.com">
      </div>

      <div class="field">
        <label for="signup-password" data-en="Password" data-ar="كلمة المرور">Password</label>
        <input type="password" id="signup-password" name="password" autocomplete="new-password"
               aria-describedby="signup-hint"
               data-en-placeholder="••••••••" data-ar-placeholder="••••••••">
        <span class="field-hint" id="signup-hint"
              data-en="Eight characters or more." data-ar="ثمانية أحرف أو أكثر.">Eight characters or more.</span>
      </div>

      <p class="form-msg" id="signup-msg" hidden role="alert"></p>

      <button type="submit" class="btn btn-primary btn-block" id="signup-submit"
              data-en="Create account" data-ar="إنشاء حساب">Create account</button>

      <p class="auth-swap">
        <span data-en="Already a customer?" data-ar="عميل بالفعل؟">Already a customer?</span>
        <button type="button" class="linkish" data-goto="signin"
                data-en="Sign in" data-ar="تسجيل الدخول">Sign in</button>
      </p>
    </form>

    <!-- Always visible, always works. No account, no network needed. -->
    <a class="guest-link" href="index.html" id="guest-link"
       data-en="Continue as guest →" data-ar="المتابعة كزائر →">Continue as guest →</a>

  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/scene.js"></script>
<script src="js/rings.js"></script>
<script src="js/film.js"></script>
<script src="js/db.js"></script>
<script src="js/main.js"></script>
</body>
</html>

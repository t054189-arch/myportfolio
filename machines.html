<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Machines — Bloom</title>
<meta name="description" content="Espresso machines, batch filter brewers and electric burr grinders for home and café, from Bloom in Kuwait.">
<!-- Restore theme and reading direction before the first paint. -->
<script>
(function () {
  try {
    var theme = localStorage.getItem('bloom.theme');
    if (theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-theme', theme);
    if (localStorage.getItem('bloom.lang') === 'ar') {
      var html = document.documentElement;
      html.setAttribute('lang', 'ar');
      html.setAttribute('dir', 'rtl');
      html.classList.add('lang-ar');
    }
  } catch (e) { /* private mode — carry on in English and the OS theme */ }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">

      <p class="lede" data-en="Espresso, filter and grinding — the three machines a bar actually runs on, in sizes that fit a kitchen too." data-ar="إسبريسو وتقطير وطحن — المكائن الثلاث التي يقوم عليها أي بار، وبمقاسات تناسب المطبخ أيضاً.">Espresso, filter and grinding — the three machines a bar actually runs on, in sizes that fit a kitchen too.</p>
    </div>

    <div class="row-between">
      <!-- Tag pills filter the grid in place, no page reload -->

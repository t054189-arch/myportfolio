<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product — Bloom</title>
<meta name="description" content="A single product at Bloom Kuwait — beans, brewing tools or machines, with the recipe or the specifications that go with it.">
<!-- Restore theme and reading direction before the first paint. -->
<script>
(function () {
  try {
    var theme = localStorage.getItem('bloom.theme');
    if (theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-theme', theme);
    if (localStorage.getItem('bloom.lang') === 'ar') {
      var html = document.documentElement;
      html.setAttribute('lang', 'ar');
      html.setAttribute('dir', 'rtl');
      html.classList.add('lang-ar');
    }
  } catch (e) { /* private mode — carry on in English and the OS theme */ }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,400&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;600&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body data-page="product" data-title-en="Product — Bloom" data-title-ar="منتج — بلوم">
<!-- The header, footer and cart drawer are injected by js/main.js so that
     every page carries exactly the same one. -->
<main id="main">
  <!-- Everything here is rendered from ?id= by js/main.js, including the h1 -->
  <section class="wrap block-tight" id="product-host"></section>
</main>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
</body>
</html>
